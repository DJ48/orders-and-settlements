name: Uptime ping

# Render's free tier spins the API down after ~15 minutes idle; the next request then pays a
# 30-50s cold-start penalty — a bad first impression for anyone clicking the live demo link cold.
# Pinging /health well inside that idle window keeps the instance warm. /health specifically:
# it's the liveness check (no DB call, no auth) built for exactly this kind of frequent
# automated hit, and it's excluded from request logging so this doesn't spam the API's logs.
#
# Caveats worth knowing: this only runs once merged to the default branch — GitHub Actions
# schedules on other branches are inert. GitHub also doesn't guarantee the exact minute a
# scheduled workflow fires (more so on low-activity repos), so treat "every 10 minutes" as
# "comfortably more often than the 15-minute idle window", not a precise clock.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # manual "Run workflow" button, for testing without waiting on the cron

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: curl --fail --silent --show-error https://orders-and-settlements-o1kh.onrender.com/api/v1/health
